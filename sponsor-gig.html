  };

  /* ── RENDER ── */
  function getParam(key) {
    var params = new URLSearchParams(window.location.search);
    return params.get(key);
  }

  function renderPage() {
    var gigId = getParam('gig');
    var gig = GIGS[gigId];
    var wrap = document.getElementById('pageWrap');

    if (!gig) {
      wrap.innerHTML = '<div style="text-align:center;padding:5rem 1rem;"><h2 style="font-size:1.5rem;font-weight:800;margin-bottom:0.75rem;">Gig not found</h2><p style="color:rgba(255,255,255,0.4);margin-bottom:2rem;">This gig may have been removed or the link is incorrect.</p><a href="dashboard.html" style="color:var(--accent);font-weight:700;text-decoration:none;">← Back to Dashboard</a></div>';
      return;
    }

    var dodHTML = gig.dod.map(function(d) {
      var cls = gig.status === 'paid' ? 'met' : (gig.status === 'submitted' || (gig.status === 'active' && d.met) ? 'met' : 'pending-check');
      var icon = (cls === 'met') ? '✓' : '·';
      return '<li class="dod-item ' + cls + '"><span class="dod-check">' + icon + '</span><span>' + d.text + '</span></li>';
    }).join('');

    var timelineHTML = gig.timeline.map(function(t, i) {
      var connector = (i < gig.timeline.length - 1) ? '<div class="tl-connector"></div>' : '';
      var icon = t.state === 'done' ? '✓' : (t.state === 'current' ? '●' : '○');
      return '<div class="tl-row"><div class="tl-line-wrap"><div class="tl-dot ' + t.state + '">' + icon + '</div>' + connector + '</div><div class="tl-content"><h4>' + t.label + '</h4><p>' + t.date + '</p></div></div>';
    }).join('');

    var contractorHTML;
    if (!gig.contractor) {
      contractorHTML = '<div class="contractor-card unclaimed"><div class="cc-label">Contractor</div><div class="cc-unclaimed-msg"><span class="icon">🔓</span>This gig is open on the board and hasn\'t been claimed yet. Once a contractor accepts, their profile will appear here.</div></div>';
    } else {
      var c = gig.contractor;
      var tagsHTML = c.tags.map(function(t) { return '<span class="cc-tag">' + t + '</span>'; }).join('');
      contractorHTML = '<div class="contractor-card"><div class="cc-label">Contractor on this Gig</div><div class="cc-avatar">' + c.initials + '</div><div class="cc-name">' + c.name + '</div><div class="cc-sub">' + c.sub + '</div><div class="cc-verify">' + c.verify + '</div><div class="cc-tags">' + tagsHTML + '</div><div class="cc-stats"><div class="cc-stat"><div class="n">' + c.gigs + '</div><div class="l">Gigs Done</div></div><div class="cc-stat"><div class="n">' + c.rating + '</div><div class="l">Rating</div></div></div><a href="profile.html" class="btn-profile">View Full Profile →</a></div>';
    }

    var reviewHTML = '';
    if (gig.reviewMode) {
      reviewHTML = '<div class="review-panel"><h3>⏱ Review Window Active</h3><p>The contractor has submitted their work. Review against the checklist below and approve or open a dispute. If you don\'t respond, work auto-approves in:</p><div class="review-timer">18:00:00</div><div class="review-btns"><button class="btn-approve" onclick="alert(\'Work approved. Escrow released to contractor wallet.\')">Approve &amp; Release Escrow</button><button class="btn-dispute" onclick="alert(\'Dispute filed. Admin will arbitrate within 48 hours.\')">Open Dispute</button></div></div>';
    }

    var payoutHTML = '';
    if (gig.payout) {
      var p = gig.payout;
      payoutHTML = '<div class="payout-card"><h3>Payout Confirmed</h3><div class="payout-amount">' + p.amount + '</div><div class="payout-sub">Disbursed to contractor\'s verified vendors</div><div class="payout-items"><div class="payout-item"><span>Vendor 1</span><span>' + p.vendor1 + '</span></div><div class="payout-item"><span>Vendor 2</span><span>' + p.vendor2 + '</span></div><div class="payout-item"><span>Payout Date</span><span>' + p.date + '</span></div></div></div>';
    }

    var autoRemoveHTML = gig.autoRemove ? '<div class="meta-item"><div class="meta-label">Auto-Remove Date</div><div class="meta-val">' + gig.autoRemove + '</div></div>' : '';

    wrap.innerHTML = `
      <div class="breadcrumb">
        <a href="dashboard.html">Dashboard</a>
        <span class="breadcrumb-sep">›</span>
        <span>${gig.status === 'paid' ? 'Completed' : 'Active Posts'}</span>
        <span class="breadcrumb-sep">›</span>
        <span style="color:rgba(255,255,255,0.6)">${gig.title.length > 50 ? gig.title.slice(0, 50) + '…' : gig.title}</span>
      </div>

      <div class="page-hd">
        <div class="page-hd-left">
          <div class="gig-cat-tag ${gig.cat}">${gig.catLabel}</div>
          <h1>${gig.title}</h1>
          <span class="status-pill ${gig.status}">${gig.statusLabel}</span>
        </div>
        <div class="page-hd-right">
          <div class="pay-amount">${gig.pay}</div>
          <div class="pay-label">Flat Fee · Escrow Locked</div>
        </div>
      </div>

      <div class="detail-layout">
        <div>
          <div class="detail-card">
            <div class="detail-card-title">Project Description</div>
            <p class="detail-desc">${gig.desc}</p>
          </div>

          <div class="detail-card">
            <div class="detail-card-title">Definition of Done Checklist</div>
            <ul class="dod-list">${dodHTML}</ul>
          </div>

          <div class="detail-card">
            <div class="detail-card-title">Gig Details</div>
            <div class="meta-grid">
              <div class="meta-item"><div class="meta-label">Date Posted</div><div class="meta-val">${gig.posted}</div></div>
              <div class="meta-item"><div class="meta-label">Deadline</div><div class="meta-val">${gig.deadline}</div></div>
              <div class="meta-item"><div class="meta-label">Time Since Posted</div><div class="meta-val">${gig.timePosted}</div></div>
              <div class="meta-item"><div class="meta-label">Status Note</div><div class="meta-val">${gig.timeLeft}</div></div>
              ${autoRemoveHTML}
              <div class="meta-item"><div class="meta-label">Category</div><div class="meta-val">${gig.catLabel}</div></div>
            </div>
          </div>

          <div class="detail-card">
            <div class="detail-card-title">Project Timeline</div>
            <div class="timeline">${timelineHTML}</div>
          </div>
        </div>

        <div>
          ${reviewHTML}
          ${payoutHTML}
          ${contractorHTML}
        </div>
      </div>
    `;

    /* start review countdown if applicable */
    if (gig.reviewMode) {
      var secs = 18 * 3600;
      setInterval(function() {
        secs = Math.max(0, secs - 1);
        var h = Math.floor(secs / 3600);
        var m = Math.floor((secs % 3600) / 60);
        var s = secs % 60;
        var el = document.querySelector('.review-timer');
        if (el) el.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
      }, 1000);
    }
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  var _orig = window.__eeSetRole;
  window.__eeSetRole = function(role) {
    if (_orig) _orig(role);
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderPage);
  } else {
    renderPage();
  }
</script>
<script src="dev-nav.js"></script>
</body>
</html>
